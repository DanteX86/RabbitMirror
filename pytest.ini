[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --cov=rabbitmirror
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    web: marks tests related to web endpoints
    database: marks tests related to database functionality
    components: marks tests related to component integration
    parser: marks tests related to parser functionality
    cluster: marks tests related to clustering functionality
    adversarial: marks tests related to adversarial profiling
    security: marks tests related to security functionality
    performance: marks tests as performance tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
