default_language_version:
  python: python3

exclude: |
  (?x)^(
    .venv/|
    venv/|
    env/|
    build/|
    dist/|
    node_modules/|
    docs/_build/|
    .*/__pycache__/|
    .*\.egg-info/|
    _artifacts/|
    benchmark_results/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        args: ["--line-length=88"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [
          "--max-line-length=127",
          "--ignore=E203,W503,E501",
        ]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-r", "rabbitmirror/"]
        files: ^rabbitmirror/

  - repo: local
    hooks:
      - id: pytest
        name: pytest (venv)
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        args: ["-q"]
        stages: [commit]
