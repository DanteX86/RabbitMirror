{% extends "base.html" %}
{% block content %}
  <h1>Upload Watch History (html/json)</h1>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
      {% for m in messages %}
        <li>{{ m }}</li>
      {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  <form method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept=".html,.json" />
    <button type="submit">Upload</button>
  </form>
{% endblock %}
